# This workflow will install Python dependencies, run tests on each supported version of Python and lint
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      # Report every version of Python which fails, not just the first
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install hatch
      run: |
        python -m pip install --upgrade pip
        pip install hatch
    - name: Run test suite
      env:
        # Make hatch environments use this version of Python
        HATCH_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      run: |
        hatch run test

  lint:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.10
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
    - name: Install hatch
      run: |
        python -m pip install --upgrade pip
        pip install hatch
    - name: Type checking with mypy
      env:
        HATCH_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      run: |
        hatch run lint:typing
    - name: Check formatting with black and ruff
      env:
        HATCH_PYTHON: ${{ steps.setup-python.outputs.python-path }}
      run: |
        hatch run lint:style

  docker:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build image
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: castep-linter:test
    - name: Check the linter runs in the image
      run: |
        docker run --rm castep-linter:test --help
        mkdir smoke-test
        printf 'program check\nend program check\n' > smoke-test/check.f90
        docker run --rm -v "$PWD/smoke-test:/src" castep-linter:test check.f90
