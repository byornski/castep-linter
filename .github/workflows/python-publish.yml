# This workflow will build a Python Package and upload it to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# It uses PyPI trusted publishing, so needs no API token: PyPI accepts the upload because it comes
# from this workflow, in the pypi environment, which must be registered as a trusted publisher at
# https://pypi.org/manage/project/castep-linter/settings/publishing/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
    - name: Build package
      run: hatch build
    - name: Store the package for publishing
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:

    # Publish separately from building, so only this job can prove its identity to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/castep-linter
    permissions:
      # Lets the job request the token PyPI uses to check where the upload comes from
      id-token: write

    steps:
    - name: Fetch the package
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
